name:
  ja: HOSHUTARO
  en: HOSHUTARO
tagline:
  ja: 現場の Excel を、ローカル LLM でエンタープライズ台帳へ変換する設備保全 PWA。
  en: Convert field Excel data into enterprise-ready maintenance records — locally, without cloud.
description:
  ja: |
    製造・設備管理の現場では、点検・保全の記録が担当者ごとの Excel に散らばっています。それを Maximo などのエンタープライズ EAM に取り込むには、フォーマット変換という大きな壁があります。

    保守たろうはその変換をローカル LLM（OpenVINO + Gemma）で処理します。データは一切クラウドに送信されないため、機密性の高い設備情報も安全に扱えます。さらに LoRA を組み込み、自社設備・業界固有の用語や台帳構造にモデルを継続的に適応させることで、変換精度を現場に合わせて育てていけます。

    AI チャットによる問い合わせ、Excel／JSON のインポート・エクスポート、プラグイン経由の外部システム連携を備えた PWA として開発中。
  en: |
    Field maintenance records live in individual Excel files — and getting them into enterprise EAM systems like Maximo means wrestling with format conversion every time.

    Hoshutaro handles that conversion with a local LLM (OpenVINO + Gemma). Nothing leaves the device, so sensitive asset data stays secure. LoRA integration lets the model be continuously adapted to your equipment vocabulary and ledger structure, improving conversion accuracy the more you use it.

    Built as a PWA with AI chat, Excel/JSON import-export, and a plugin layer for enterprise system integration. Currently in development.
status: in-development
