name:
  ja: TSUNAGI Stocks
  en: TSUNAGI Stocks
tagline:
  ja: moomoo API で自動売買を試す、実験的な株式ダッシュボード。
  en: An experimental stock trading dashboard for automating trades via the moomoo API.
description:
  ja: |
    趣味で続けている米国株投資で、自分の売買ロジックを自動化できないか実験するために作ったツールです。自動売買に必要な API を提供している国内外の証券会社を調べた結果、moomoo（富途）が唯一の選択肢でした。

    テスト動作は確認済みで、整数株（1株単位）の売買であれば意図通りに動きます。ただし、moomoo の API が端数株（fractional shares）の注文に対応していないことが判明し、現在は実際の運用には使用していません。

    コードは GitHub で公開しています。整数株のみで運用している方や、moomoo API を使った自動売買の仕組みを調べている方の参考になれば。
  en: |
    A tool built to experiment with automating my own trading logic for US stocks. After researching which brokers offer a usable trading API, moomoo (Futu) turned out to be the only option.

    Test runs confirm it works for whole-share orders. However, the moomoo API doesn't support fractional shares, which is why I haven't put it into live use.

    The code is on GitHub — useful if you trade whole shares or want to explore automated trading with the moomoo API.
status: in-development
repo: https://github.com/tsunagi-app/tsunagi-stocks
tags:
