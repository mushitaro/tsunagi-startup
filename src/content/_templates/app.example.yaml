# アプリ追加テンプレート。
# このファイルを src/content/apps/<slug>.yaml としてコピーし、ファイル名（slug）= URL になる。
# 例: src/content/apps/my-app.yaml -> /tsukuru/my-app
name:
  ja: アプリ名
  en: App name
tagline: # 一覧カード用の短い説明（1行）
  ja: ひとことで表す短い説明。
  en: A short one-line description.
description: # 詳細ページ用の説明（段落は空行で区切る）
  ja: アプリの詳しい説明をここに書く。
  en: A longer description of the app.
status: in-development # live | in-development | planned
url: https://example.tsunagi.app # 公開中アプリの URL（任意）
repo: https://github.com/owner/repo # リポジトリ URL（任意）
tags: # 任意
  - タグ1
  - タグ2
thumbnail: # カードの主画像（1280×720。任意。詳細ページの見出し画像と OG 画像にもなる。言語で替えないなら文字列 1 つでよい）
  ja: /images/apps/my-app-ja.png
  en: /images/apps/my-app-en.png
icon: /images/apps/my-app-icon.png # 名前の左に出す製品のアイコン（製品の色のまま。任意）
# nameFont: # 名前の字体（任意。Google Fonts の書体名）
#   family: Krona One
#   weight: 400
#   tracking: 0.18em
featured: false # true で一覧の先頭に出す
order: 4 # 並び順と表示番号（小さいほど上＝先頭。1 は「01」）
launchedAt: 2025-01-01 # 公開日（任意）
# video: # 詳細ページに出す紹介動画（任意）
#   title:
#     ja: 動画の題名
#     en: Video title
#   url: https://youtu.be/xxxxxxxxxxx
# editions: # 詳細ページに出すエディション（任意。上から 01, 02…）
#   - name: エディション名
#     label: Apache 2.0 / Open Source # ライセンスや提供形態の短い札
#     body:
#       ja: 中身の説明。
#       en: What it includes.
